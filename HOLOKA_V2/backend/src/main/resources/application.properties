spring.application.name=holoka-backend
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=holoka_newconcept_it;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=dbo
spring.flyway.create-schemas=false
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
holoka.auth.jwt-secret=${JWT_SECRET:dmVyeV9zZWNyZXRfZGVmYXVsdF9qd3Rfa2V5X2Zvcl9sb2NhbF9kZXZlbG9wbWVudF9vbmx5}
holoka.auth.issuer=holoka
holoka.auth.access-seconds=900
holoka.auth.refresh-days=14
holoka.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
holoka.auth.requests-per-minute=30
holoka.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
holoka.contracts.scheduling-enabled=${CONTRACT_SCHEDULER_ENABLED:true}
holoka.contracts.reconcile-delay-ms=60000
holoka.contracts.initial-delay-ms=1000
holoka.alerts.events-enabled=${ALERT_EVENTS_ENABLED:true}
holoka.alerts.scheduling-enabled=${ALERT_SCHEDULER_ENABLED:true}
holoka.alerts.initial-delay-ms=3000
holoka.alerts.reconcile-delay-ms=60000

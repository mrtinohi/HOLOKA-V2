version: '3.8'

services:
  # 1. SQL Server
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: holoka-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123! # Đổi mật khẩu mạnh
      - MSSQL_PID=Express
    volumes:
      - sql_data:/var/opt/mssql
    ports:
      - "1433:1433"
    restart: always

  # 2. Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: holoka-backend
    depends_on:
      - db
    environment:
      - DB_URL=jdbc:sqlserver://db:1433;databaseName=holoka_newconcept;encrypt=false;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=YourStrongPassword123!
      - SERVER_PORT=8081
      - JWT_SECRET=c2VjdXJlX3Byb2R1Y3Rpb25fZGVlcG1pbmRfaG9sb2thX3NlY3JldF9rZXlfMjAyNg== # Chuỗi Base64 >= 32 byte
      - CORS_ALLOWED_ORIGINS=http://localhost,http://your-domain.com,https://your-domain.com
      - AUTH_COOKIE_SECURE=false # Chuyển thành true khi có SSL/HTTPS
    restart: always

  # 3. Frontend React Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: holoka-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: always

volumes:
  sql_data:
